# CI — jalan setiap push ke main dan setiap pull request.
# Aturan merge (lihat branch protection di main):
#   - CI merah  -> merge DILARANG, tombol merge mati.
#   - CI hijau  -> merge boleh, TETAPI hanya setelah verifikasi
#     manual yang ketat (baca diff PR, cek hasil run di tab Actions).
#   - Satu-satunya check yang wajib lolos adalah job `ci-gate`,
#     yang baru hijau kalau SEMUA job di bawahnya hijau.
# Tidak butuh secret / API key apa pun.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test (race detector on)
        run: go test -race ./...

      - name: Build
        run: go build -o route-x .

      - name: Smoke test
        run: |
          ./route-x --version
          ./route-x -p "cari TODO"
          ./route-x -p --output json "baca go.mod"
          ./route-x --mode plan -p "buat file demo-contoh.go"
          test ! -e demo-contoh.go

  build:
    strategy:
      matrix:
        os: [linux, windows, darwin]
        arch: [amd64, arm64]
        exclude:
          - os: windows
            arch: arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Cross-compile ${{ matrix.os }}/${{ matrix.arch }}
        run: CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -o route-x-${{ matrix.os }}-${{ matrix.arch }} .

  # Satu pintu gerbang: hijau hanya kalau test DAN build semua hijau.
  # Branch protection mewajibkan check ini, bukan job-job di atas
  # satu per satu, supaya menambah job baru tidak lupa update
  # aturan merge.
  ci-gate:
    if: always()
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.build.result }}" != "success" ]; then
            echo "CI gate: FAILED (test=${{ needs.test.result }}, build=${{ needs.build.result }})"
            exit 1
          fi
          echo "CI gate: all green"
